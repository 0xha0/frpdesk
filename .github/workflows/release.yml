# a tag builds the UI and the binaries (linux amd64/arm64, darwin arm64) and publishes them on the
# tag's release with their sha256s; every push and PR just builds and vets
name: build
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: ui/package-lock.json }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: make test
      - run: make release VERSION=${GITHUB_REF_NAME}
        if: startsWith(github.ref, 'refs/tags/')
      - run: make build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.tar.gz
            dist/sha256sums.txt
