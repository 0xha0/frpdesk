# the frps side: frps asks frpdesk at every login, proxy and connection. Add to frps.toml:

bindPort = 7000
auth.token = "the frps auth.token"   # the same as [client] token in frpdesk.toml
transport.tls.force = true
allowPorts = [{ start = 30000, end = 39999 }]

# frps's dashboard, for frpdesk only
webServer.addr = "127.0.0.1"
webServer.port = 7500
webServer.user = "admin"
webServer.password = "change-me"

[[httpPlugins]]
name = "frpdesk"
addr = "127.0.0.1:7200"
path = "/handler"
ops = ["Login", "NewWorkConn", "NewUserConn", "NewProxy", "Ping"]
